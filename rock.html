<script>
  console.log("Hello Player!")
  
  //How do we make the computer return the choice
  //We can use Math.random to get choice between 0-1


  let humanScore = 0;
  let computerScore = 0;

  function getComputerChoice() {
    const randomChoice = Math.random();
    let computerMove = '';
    if(randomChoice < 1/3) {
      computerMove ='rock'
      console.log('computer choose:', computerMove);
    } else if (randomChoice < 2/3) {
      computerMove = 'paper'
      console.log('computer choose:', computerMove);
    } else {
      computerMove = 'scissor'
      console.log('computer choose:', computerMove);
    }
    return computerMove;
  }

  function getHumanChoice() {
    let answer = prompt("What's your choice",'');
    if (!answer) return null;
    
    const input = answer.toLowerCase();
    if (input === 'rock' || input === 'paper' || input === 'scissor') {
     console.log('you choose:', input);
    return input;
    }
    return null;
  }
    
  function playRound(human, computer) {
    if (human === computer) {
      console.log('tie')
      return 'tie';
    }
    if (
      (human === 'rock' && computer === 'scissor') ||
      (human === 'paper' && computer === 'rock') ||
      (human === 'scissor' && computer === 'paper')
    ) {
      humanScore++;
      console.log('your score:', humanScore);
      console.log('computer score:', computerScore);
      console.log(`You win! ${human} beats ${computer}`)
      return 'human';
    } 
     computerScore++;
     console.log('computer score:', computerScore);
     console.log('your score:', humanScore);
     console.log(`You lose! ${computer} beats ${human}`)
     return 'computer';
  }

 
  function playGame() {
    for (let i = 1; i <=5; i++) {
      const humanSelection = getHumanChoice();
      if(humanSelection === null) return {humanScore, computerScore};

      const computerSelection = getComputerChoice();
       playRound(humanSelection, computerSelection);
    }
    if (humanScore > computerScore) {
      console.log('You win');
    } else {
      console.log("Computer win")
    }
  }

  playGame();
</script>
