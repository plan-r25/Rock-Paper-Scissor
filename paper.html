<script>
  console.log("Hello Player!");

  //Get the computer to generate random choice
  //We could use Math.random

  let humanScore = 0;
  let computerScore = 0;
  let round = 0;

  function getComputerChoice() {
    const r = Math.random();
    let choice = '';
    if (r < 1/3) {
      choice = 'rock';
    } else if ( r < 2/3) {
      choice = 'paper';
    } else {
      choice = 'scissor';
    }
    return choice;
  }

  //Use prompt for human to give their choice
  //Convet it to toLowerCase() to make it case insensitive
  //Use array for input to reduce lines of code

  function getHumanChoice() {
    
    let answer = prompt("What is your chocie", '');
    if (!answer) return null;
    let input = answer.toLowerCase();
    if (['rock', 'paper', 'scissor'].includes(input)) {
      return input;
    }
    return null;
  }

  //We are going to combine those two above functions
  //Compare the two choices and declare a winner
  //Store their wins

  

  function playRound(human, computer) {
    if (human === computer) {
      round++
      console.log(`Round ${round}`)
      console.log('tie');
      console.log('You choose:', human);
      console.log('computer choose:', computer);
      console.log("Your score:", humanScore);
      console.log("computer score:", computerScore);
      return 'tie';
    }
    if (
     (human === 'rock' && computer === 'scissor') || 
     (human === 'paper' && computer === 'rock') || 
     (human === 'scissor' && computer === 'paper')
    ) {
      humanScore++;
      round++
      console.log(`Round ${round}`)
      console.log('You choose:', human);
      console.log('computer choose:', computer);
      console.log(`You win ${human} beats ${computer}`);
      console.log("Your score:", humanScore);
      console.log("computer score:", computerScore);
      return human
    } else {
      computerScore++;
      round++
      console.log(`Round ${round}`)
      console.log('You choose:', human);
      console.log('computer choose:', computer);
      console.log(`You lose ${computer} beats ${human}`);
      console.log("Your score:", humanScore);
      console.log("Computer score:", computerScore);
      return computer;
    }
  }

  (async function() {
    const delay = (ms) => new Promise(res => setTimeout(res, ms));
    for (let i = 1; i <= 5; i++) {
      const  humanSelection = getHumanChoice();
      if (humanSelection === null) return;
      const computerSelection = getComputerChoice();
      
      playRound(humanSelection, computerSelection);
      await delay(2000);
    }

    if (humanScore > computerScore) {
      console.log("You win 🎉")
    } else {
      console.log("You loose ")
    }
  })();
</script>
