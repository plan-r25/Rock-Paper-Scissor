<!DCOTYPE html>
<html lang="en">
  <head>
    <meta charset="utf8">
    <meta name="viewport" width="device-width" initial="1.0">
    <title>Rock Paper Scissor Game</title>
    <style>
      body {
        height: 100vh;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      .container {
        padding: 20px;
      }
      .score-board {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
      }
      .score {
        background-color: black;
        padding: 15px;
      }
      .score p {
        color: grey;
      }
      .score span {
        color: white;
      }
      .buttons {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
      }
      button {
        padding: 6px 28px;
      }

    </style>
  </head>
  <body>
    <button id="play-again">Play Again</button>
    <h1>Choose Your Choice</h1>
    <div class="container">
      <div class="score-board">
        <div class="score">
          <p>Human Score: <span id="human-score">0</span></p>
        </div>
        <div class="score">
          <p>Computer Score: <span id="computer-score">0</span></p>
        </div>
      </div>
      <h3 id="result"></h3>
      <div class="buttons">
        <button id="rock">Rock</button>
        <button id="paper">Paper</button>
        <button id="scissor">Scissor</button>
      </div>
    </div>
    <script>
      const humanScore = document.querySelector("#human-score");
      const computerScore = document.querySelector("#computer-score");
      const result = document.querySelector("#result");
      const buttons = document.querySelectorAll("button");
      const btn = document.querySelector("#play-again");

      let humanPoints = Number(humanScore.textContent);
      let computerPoints = Number(computerScore.textContent);
      let round = 0; //this is for console
      let gameOver = false;
      btn.style.display = 'none';

      //we use math.random to get computer choice
      function getComputerChoice() {
        const r = Math.random();
        let choice = '';
        if (r < 1/3) {
          choice = 'rock'
        } else if (r < 2/3) {
          choice = 'paper'
        } else if (r < 1) {
          choice = 'scissor'
        }
        return choice;
      };

   

      //we'll listen for the user buttons at once
      buttons.forEach(button => {
        button.addEventListener("click", () => {
          if (gameOver) return;
          const computerSelection = getComputerChoice();
          getGameLogic(button.id, computerSelection)
        })
      });

         //we add a listener for play again
      btn.addEventListener("click", () => {
        humanScore.textContent = 0;
        computerScore.textContent = 0;
        result.textContent = '';
        gameOver = false;
        btn.style.display = 'none';
      });

      //we'll set up the game logic
      function getGameLogic(human, computer) {
        if (human === computer) {
          round++;
          console.log('Round:',round);
          result.textContent = `It's a tie, you both choose ${computer}`;
          console.log("you choose:", human)
          console.log("Computer choose:", computer)
        } else if (
          (human === 'rock' && computer === 'scissor')
          || (human === 'paper' && computer === 'rock')
          || (human === 'scissor' && computer === 'paper')
        ) {
          round++;
          humanPoints++
          humanScore.textContent = humanPoints;
          if (humanPoints === 5) {
            result.textContent = `You win 🎉`;
            gameOver = true;
            btn.style.display = 'block';
          } else {
          result.textContent = `You win: ${human} beats ${computer}`;
          btn.style.display = 'none';
          }
          console.log('Round:',round);
          console.log("you choose:", human);
          console.log("Computer choose:", computer);
          return human;
        } else {
          round++;
          computerPoints++;
          computerScore.textContent = computerPoints;
          if (computerPoints === 5) {
            result.textContent = `You loose 😒`;
            gameOver = true;
            btn.style.display = 'block';
          } else {
          result.textContent = `You loose: ${computer} beats ${human}`;
          btn.style.display = 'none';
          }
          console.log('Round:',round);
          console.log("you choose:", human);
          console.log("Computer choose:", computer);
          return computer;
        }
      };
    </script>
  </body>

</html>
